name: Build XTruyen Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-plugin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create plugin
        run: |
          mkdir -p xtruyen
          echo '' | base64 -d > xtruyen/plugin.zip
          unzip -p xtruyen/plugin.zip icon.png > xtruyen/icon.png
      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtruyen/plugin.zip xtruyen/icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Build XTruyen VBook plugin v3"
          git pull --rebase origin main
          git push origin main
