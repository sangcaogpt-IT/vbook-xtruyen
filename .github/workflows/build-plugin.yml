name: Build XTruyen Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'xtruyen/plugin.json'
      - 'xtruyen/src/**'
      - '.github/workflows/build-plugin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build plugin.zip from source
        run: |
          rm -f xtruyen/plugin.zip
          cd xtruyen
          zip -r plugin.zip plugin.json icon.png src
      - name: Save generated plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtruyen/plugin.zip
          git diff --cached --quiet && exit 0
          git commit -m "Build XTruyen VBook plugin v4"
          git pull --rebase origin main
          git push origin main
